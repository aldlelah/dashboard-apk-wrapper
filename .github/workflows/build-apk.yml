name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: DashboardApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DashboardApp-test.apk
          gh release create "test-${{ github.run_number }}" DashboardApp-test.apk --prerelease -t "تجربة ${{ github.run_number }}" -n "بناء تجريبي (debug)"
